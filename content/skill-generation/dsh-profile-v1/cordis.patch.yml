# Project D StarCraft TMG offline Skill-generation profile.
#
# This layer is applied after the shipped dsh-base + dsh-headless bundles.
# It leaves only the in-process Agent/Session/headless lifecycle active. Provider
# and candidate-tool bridges are mounted by a later, hash-bound job overlay.

- id: hmr
  disabled: true

- id: agent-default-model
  config:
    provider: project-d-offline-broker
    model: project-d-frozen-job-model

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    packChunks: false
    compression: none

- id: system-prompt
  config:
    persona: >-
      Project D offline Skill candidate generation. Use only staged evidence and
      emit a candidate only through the approved candidate tool.

